name: WordPress figyelő

on:
  schedule:
    # 15 percenként (UTC). Privát tárolóban ritkábban: '0 */2 * * *' (kétóránként)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mod:
        description: 'Mit csináljon?'
        type: choice
        options:
          - ellenorzes
          - alapallapot-frissites
        default: ellenorzes

permissions:
  contents: write

concurrency:
  group: wp-figyelo
  cancel-in-progress: false

jobs:
  figyeles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          # Mindig a legfrissebb állapot kell (egy sorban álló futás különben a régit kapná)
          ref: ${{ github.ref_name }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Böngésző telepítése
        run: npx playwright install --with-deps --only-shell chromium

      - name: Riasztási állapot visszatöltése
        uses: actions/cache/restore@v4
        with:
          path: allapot
          key: allapot-${{ github.run_id }}
          restore-keys: allapot-

      - name: Ellenőrzés
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mod }}" = "alapallapot-frissites" ]; then
            node src/figyelo.mjs --alapallapot
          else
            node src/figyelo.mjs
          fi

      - name: Riasztási állapot mentése
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allapot
          key: allapot-${{ github.run_id }}

      - name: Riport feltöltése
        if: always() && (steps.check.outputs.problemak == 'true' || steps.check.outcome == 'failure' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: riport-${{ github.run_number }}
          path: riport/
          retention-days: 5

      - name: Alapállapot mentése / ütemezés életben tartása
        if: always()
        run: |
          git config user.name "wp-figyelo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          if [ -n "$(git status --porcelain alapallapot)" ]; then
            git add alapallapot
            git commit -m "Alapállapot frissítve"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            # 45 napnál régebbi utolsó commit: a GitHub 60 nap után leállítaná az ütemezést
            git commit --allow-empty -m "Életjel: az ütemezett figyelés aktív marad"
          else
            exit 0
          fi
          # Ha közben más is írt a tárolóba (pl. egy másik futás), a mi változatunkat ráépítjük
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            if ! git pull --rebase -X theirs origin "${BRANCH}"; then
              git rebase --abort || true
              echo "::warning::Az alapállapotot most nem sikerült elmenteni, a következő futás újra próbálja."
              exit 0
            fi
          done
          echo "::warning::Az alapállapotot többszöri próbálkozásra sem sikerült elmenteni."
          exit 0
